<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Martini Class</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script defer src="./assets/js/firebase.js"></script>
    <script defer src="./assets/js/main.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header" aria-label="Martini main navigation">
        <a class="brand" href="./index.html" aria-label="마티니 메인으로 이동">
          <img class="brand__name" src="./assets/images/Name.png" alt="Martini" />
        </a>

        <nav class="header-actions" aria-label="계정 메뉴">
          <button class="login-link" type="button" data-route="./login.html">
            로그인
          </button>
        </nav>
      </header>

      <main class="main-content">
        <section class="gateway-grid" aria-label="클래스 페이지 바로가기">
          <article class="gateway-card gateway-card--ticketing">
            <div>
              <p class="gateway-card__label">정기 교육</p>
              <h2>칵테일 클래스</h2>
              <p>
                매주 진행되는 칵테일 클래스에 신청할 수 있습니다.
              </p>
            </div>
            <button class="gateway-card__button" type="button" data-route="./vote.html">
              신청 페이지
            </button>
          </article>

          <article class="gateway-card gateway-card--private">
            <div>
              <p class="gateway-card__label">특별한 체험</p>
              <h2>개인 클래스</h2>
              <p>
                임원이 개인적으로 준비하는 특별한 주류를 체험해보세요
              </p>
            </div>
            <button class="gateway-card__button" type="button" data-route="./private-class.html">
              자세히 보기
            </button>
          </article>

          <article class="gateway-card gateway-card--attendance is-hidden" data-attendance-card>
            <div>
              <p class="gateway-card__label">Attendance</p>
              <h2>출석부</h2>
              <p>
                요일별 신청자 출석 여부를 확인하고 결석 인원을 기록합니다.
              </p>
            </div>
            <button class="gateway-card__button" type="button" data-route="./attendance.html">
              출석 확인
            </button>
          </article>

          <article class="gateway-card gateway-card--admin is-hidden" data-admin-card>
            <div>
              <p class="gateway-card__label">Executive Console</p>
              <h2>관리 페이지</h2>
              <p>
                마티니 운영을 위한 관리 페이지로 이동합니다.
              </p>
            </div>
            <button class="gateway-card__button" type="button" data-route="./admin.html">
              관리하기
            </button>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
