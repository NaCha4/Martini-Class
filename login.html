<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Martini Login</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script defer src="./assets/js/utils.js"></script>
    <script defer src="./assets/js/firebase.js"></script>
    <script defer src="./assets/js/login.js"></script>
  </head>
  <body class="auth-page">
    <div class="site-shell">
      <header class="site-header" aria-label="Martini login navigation">
        <a class="brand" href="./index.html" aria-label="마티니 메인으로 이동">
          <img class="brand__name" src="./assets/images/Name.png" alt="Martini" />
        </a>

        <nav class="header-actions" aria-label="페이지 이동">
          <button class="login-link" type="button" data-route="./index.html">
            메인으로
          </button>
        </nav>
      </header>

      <main class="auth-content">
        <section class="auth-panel" aria-labelledby="login-title">
          <p class="intro__eyebrow">Executive Login</p>

          <form class="auth-form" data-login-form>
            <label class="auth-field">
              <span>이메일</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>

            <label class="auth-field">
              <span>비밀번호</span>
              <input type="password" name="password" autocomplete="current-password" required />
            </label>

            <button class="auth-button auth-button--primary" type="submit" data-login-button>
              로그인
            </button>
            <button class="auth-button auth-button--ghost is-hidden" type="button" data-admin-button>
              관리 페이지로 이동
            </button>
            <button class="auth-button auth-button--ghost is-hidden" type="button" data-logout-button>
              로그아웃
            </button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
