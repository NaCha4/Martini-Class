<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — Martini</title>
  <link rel="icon" href="assets/images/Logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body class="page-auth">

  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <img src="assets/images/Logo.png" alt="Martini" class="auth-brand-img" />
      <img src="assets/images/Name.png" alt="Martini" class="auth-brand-name" />
    </div>

    <p class="auth-title">관리자 로그인</p>
    <p class="auth-sub">Firebase에 등록된 계정으로 로그인하세요.</p>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input class="form-input" type="email" id="email" placeholder="admin@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">로그인</button>

      <div class="auth-error" id="authError"></div>
    </form>

    <a href="index.html" class="auth-back">← 홈으로 돌아가기</a>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyBS0s30cL-sCo35nN0VjJvDaFyH_yPe930",
      authDomain:        "martini-class-d4d69.firebaseapp.com",
      projectId:         "martini-class-d4d69",
      storageBucket:     "martini-class-d4d69.firebasestorage.app",
      messagingSenderId: "994424737344",
      appId:             "1:994424737344:web:555117a1674e6ba0ae59a5"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form     = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errBox   = document.getElementById('authError');

    const ERROR_MESSAGES = {
      'auth/invalid-email':        '이메일 형식이 올바르지 않습니다.',
      'auth/user-not-found':       '등록되지 않은 계정입니다.',
      'auth/wrong-password':       '비밀번호가 틀렸습니다.',
      'auth/invalid-credential':   '이메일 또는 비밀번호가 올바르지 않습니다.',
      'auth/too-many-requests':    '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.',
      'auth/network-request-failed': '네트워크 오류가 발생했습니다.',
    };

    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }

    function setLoading(on) {
      loginBtn.disabled    = on;
      loginBtn.textContent = on ? '로그인 중...' : '로그인';
    }

    // 이미 로그인 상태면 대시보드로 리다이렉트
    auth.onAuthStateChanged(user => {
      if (user) location.replace('dashboard.html');
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errBox.style.display = 'none';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('이메일과 비밀번호를 모두 입력해 주세요.');
        return;
      }

      setLoading(true);
      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
        await auth.signInWithEmailAndPassword(email, password);
        location.replace('dashboard.html');
      } catch (err) {
        showError(ERROR_MESSAGES[err.code] || '로그인 중 오류가 발생했습니다.');
        setLoading(false);
      }
    });
  </script>

</body>
</html>
